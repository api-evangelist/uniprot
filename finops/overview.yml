  url: https://creativecommons.org/licenses/by/4.0/
notes: >
  All UniProt data is freely available without any access fees. Commercial use
  is permitted under the CC BY 4.0 license with attribution. There are no
  premium tiers, enterprise contracts, or paid API plans.
