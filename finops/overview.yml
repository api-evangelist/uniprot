name: Financial Overview
description: >
  UniProt is a free, publicly funded resource. There are no costs associated
  with API usage. UniProt is maintained by a consortium of three organizations:
  the European Bioinformatics Institute (EMBL-EBI), the Swiss Institute of
  Bioinformatics (SIB), and the Protein Information Resource (PIR). Funding
  comes from public research grants (NIH, EU Horizon, and member state sources).
cost: 0
currency: USD
funding:
  - organization: EMBL-EBI
    url: https://www.ebi.ac.uk/
  - organization: Swiss Institute of Bioinformatics (SIB)
    url: https://www.sib.swiss/
  - organization: Protein Information Resource (PIR)
    url: https://proteininformationresource.org/
license:
